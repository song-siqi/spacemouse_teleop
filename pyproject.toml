[project]
name = "robot-teleop"
version = "0.1.0"
description = "Multi-robot teleoperation and source-native recording for real and simulated robots."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
spacemouse = [
    "hidapi>=0.15.0",
    "pyspacemouse==2.1.0",
]
xarm = ["xarm-python-sdk==1.18.4"]
realsense = [
    "pyrealsense2==2.58.4.10922",
]
recording = ["opencv-python==4.11.0.86"]
sim = [
    "mujoco==3.12.0",
    "numpy>=1.24.0",
    "robot_descriptions>=3.1.0",
    "xacrodoc>=2.0.1",
]

[project.scripts]
robot-teleop = "robot_teleop.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_teleop"]

[tool.uv]
package = true
